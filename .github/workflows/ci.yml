name: integrity
on:
  push: {branches: [main, master]}
  pull_request:

jobs:
  guard:
    name: Integrity & Tests (${{ matrix.os }}, Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Corpus integrity guard (10 checks)
        run: python scripts/validate_corpus.py
      - name: Install test runner
        run: pip install pytest
      - name: Engine + doctrine tests
        run: python -m pytest tests/ -q
      - name: Demo scan must run (English sample)
        env:
          PYTHONPATH: src
        run: python -m mijhar examples/sample_ai_like.txt --json
      - name: Demo scan must run (Arabic sample)
        env:
          PYTHONPATH: src
        run: python -m mijhar examples/sample_arabic.txt --json
      - name: Demo scan must run (Arabic Word Document)
        env:
          PYTHONPATH: src
        run: python -m mijhar "examples/الإشارة_المقنعة_نحل_وديمقراطية.docx" --json
